name: Coleta de vagas

# Busca as vagas das fontes e atualiza o banco (python -m jobfinder_api.job_sync).
# Se alguma empresa falhar, a execução fica vermelha e o GitHub avisa por e-mail; as vagas
# daquela empresa ficam como estavam.
on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 de Brasília (09:00 UTC)
  workflow_dispatch: # botão "Run workflow" na aba Actions

concurrency:
  group: coleta-vagas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coleta:
    name: Coletar vagas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar dependências
        run: pip install -e .
      - name: Coletar
        # Chaves só nos secrets do repositório (Settings → Secrets and variables → Actions).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m jobfinder_api.job_sync
